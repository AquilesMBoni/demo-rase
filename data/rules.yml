version: "3.1"

rules:

- rule: Responder saudação
  steps:
    - intent: greet
    - action: utter_greet

- rule: Responder despedida
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Informar acesso
  steps:
    - intent: ask_access
    - action: utter_access

- rule: Recuperar senha
  steps:
    - intent: ask_password
    - action: utter_password

- rule: Consultar atividades
  steps:
    - intent: ask_activities
    - action: utter_activities